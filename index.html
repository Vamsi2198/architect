<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Architect 2.0 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F3;--sheet:#FFFFFF;--ink:#141C2B;--graphite:#586171;--faint:#8A93A1;--rule:#DDE1E6;--grid:#E4E7EC;
  --draft:#2946C7;--draft-soft:#E6EBFB;--amber:#9A5B08;--amber-soft:#FBF0DC;--pass:#1B6B4A;--pass-soft:#E2F1E9;--fail:#A3261C;--fail-soft:#FAE7E5;
  --on-ink:#F5F6F3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E131B;--sheet:#151C27;--ink:#E6EAF1;--graphite:#9AA4B4;--faint:#6D7788;--rule:#263041;--grid:#1C2433;
  --draft:#8098FF;--draft-soft:#1B2545;--amber:#E3A84E;--amber-soft:#2D2413;--pass:#5DC69A;--pass-soft:#12281E;--fail:#F08B7F;--fail-soft:#311716;--on-ink:#0E131B;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0E131B;--sheet:#151C27;--ink:#E6EAF1;--graphite:#9AA4B4;--faint:#6D7788;--rule:#263041;--grid:#1C2433;
  --draft:#8098FF;--draft-soft:#1B2545;--amber:#E3A84E;--amber-soft:#2D2413;--pass:#5DC69A;--pass-soft:#12281E;--fail:#F08B7F;--fail-soft:#311716;--on-ink:#0E131B;color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{height:100%}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-0.02em}
h2{font-size:21px;line-height:1.25;font-weight:650;letter-spacing:-0.01em}
h3{font-size:15px;font-weight:600}
.muted{color:var(--graphite)}.small{font-size:13px}.tiny{font-size:12px}
code,pre,.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--draft);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.ink:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--grid)}
.btn.sm{padding:5px 10px;font-size:13px}
.input,textarea.input,select.input{width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:9px 12px;font-size:14px}
textarea.input{resize:vertical;min-height:92px;line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--grid);color:var(--graphite);white-space:nowrap}
.chip.pass{background:var(--pass-soft);color:var(--pass)}.chip.fail{background:var(--fail-soft);color:var(--fail)}.chip.warn{background:var(--amber-soft);color:var(--amber)}.chip.draft{background:var(--draft-soft);color:var(--draft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint);flex:none}
.dot.pass{background:var(--pass)}.dot.fail{background:var(--fail)}.dot.warn{background:var(--amber)}.dot.draft{background:var(--draft)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.list{border-top:1px solid var(--rule)}
.list>.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule)}
.item.click{cursor:pointer}.item.click:hover{background:var(--paper)}
.note{display:none;border-left:3px solid var(--draft);background:var(--draft-soft);color:var(--draft);font-size:13px;padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.notes-on .note{display:block}

/* solo screens */
.solo{min-height:100%;display:grid;place-items:center;padding:32px 20px}
.solo-inner{width:100%;max-width:880px}
.mark{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-0.01em}
.mark svg{width:26px;height:26px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.role{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:190px}
.role:hover{border-color:var(--ink)}
.role .who{font-size:13px;color:var(--graphite)}
.role .starts{margin-top:auto;font-size:13px;color:var(--draft);font-weight:500}
.tour-draw{margin-top:30px;height:120px;border-radius:14px;border:1px solid var(--rule);background-color:var(--sheet);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:16px 16px;position:relative;overflow:hidden}
.tour-draw svg{position:absolute;inset:0;width:100%;height:100%}
.signin{max-width:400px;margin:0 auto}
.oauth{width:100%;justify-content:flex-start;padding:11px 14px}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.rail{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;padding:16px 12px;overflow:auto;min-height:0}
.ws{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;margin:16px 0 18px;cursor:pointer;background:var(--sheet);width:100%;text-align:left}
.ws:hover{border-color:var(--faint)}
.ws .av{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
.nav a:hover{background:var(--paper)}
.nav a.on{background:var(--paper);font-weight:600}
.nav-h{font-size:12px;color:var(--faint);margin:18px 10px 6px}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin:8px 0 4px}
.meter>i{display:block;height:100%;background:var(--ink)}
.rail-foot{margin-top:auto;padding-top:16px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.crumb{font-size:14px;color:var(--graphite);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.menu-btn{display:none}.show-sm{display:none}
.page{padding:24px 20px 40px;max-width:1180px;width:100%;margin:0 auto}
.scrim{display:none}

/* home */
.prompt-box{padding:18px}
.prompt-box textarea{border:none;background:transparent;padding:0;min-height:84px;font-size:17px;outline:none;width:100%;resize:none}
.prompt-box textarea:focus-visible{outline:none}
.prompt-box:focus-within{border-color:var(--ink)}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.door{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;cursor:pointer}
.door:hover{border-color:var(--ink)}
.door .ic{width:36px;height:36px;border-radius:9px;background:var(--grid);display:grid;place-items:center;flex:none}
.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;margin-top:28px}

/* project */
.proj-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dial{display:inline-flex;border:1px solid var(--ink);border-radius:9px;overflow:hidden}
.dial button{border:none;background:transparent;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.dial button.on{background:var(--ink);color:var(--on-ink)}
.stages{display:flex;gap:0;margin:18px 0 20px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stage{display:flex;align-items:center;gap:8px;padding:10px 16px 12px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--graphite);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stage .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint)}
.stage.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.bp-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.bp-wrap.with-insp{grid-template-columns:minmax(0,1fr) 330px}
.canvas{border:1px solid var(--rule);border-radius:14px;background-color:var(--sheet);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:18px 18px;padding:18px}
.canvas{position:relative}
.lanes{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr) minmax(0,1fr);grid-template-areas:"da sc co" "da ag co";column-gap:48px;row-gap:36px;align-items:start}
.lane-data,.lane-conn{grid-row:1 / span 2}
.lane-agents .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px}
.lane-screens{grid-area:sc}.lane-agents{grid-area:ag}.lane-data{grid-area:da}.lane-conn{grid-area:co}
.lane-screens .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.wire{fill:none;stroke:var(--faint);stroke-width:1.3;opacity:.6}
.wire.on{stroke:var(--draft);stroke-width:2;opacity:1}
.wire.pending{stroke:var(--draft);stroke-dasharray:5 4;opacity:1}
@media (prefers-reduced-motion:no-preference){.wire.new{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw .8s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
.lane-h{font-size:13px;color:var(--graphite);font-weight:500;margin:0 0 10px 2px;display:flex;justify-content:space-between}
.blk{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px;cursor:pointer;margin-bottom:10px}
.blk:hover{border-color:var(--faint)}
.blk.sel{border-color:var(--draft);box-shadow:0 0 0 3px var(--draft-soft)}
.blk.pending{border-style:dashed;border-color:var(--draft)}
.blk .k{font-size:11.5px;color:var(--faint);font-weight:500;display:flex;justify-content:space-between;margin-bottom:4px}
.blk .t{font-weight:600;font-size:14px;margin-bottom:4px}
.blk .d{font-size:13px;color:var(--graphite)}
.blk pre{background:var(--paper);border-radius:6px;padding:8px;margin-top:4px;font-size:11.5px}
.ghost-blk{height:74px;border:1px dashed var(--rule);border-radius:10px;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){
  .blk.new{animation:drop .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
}
.insp{padding:16px;align-self:start;position:sticky;top:64px}
.cmd{position:sticky;bottom:0;margin-top:16px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%)}
.cmd-bar{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;border:1px solid var(--ink);border-radius:12px;background:var(--sheet)}
.cmd-bar input{flex:1;border:none;background:transparent;outline:none;font-size:15px;min-width:0}
.change{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);margin-top:10px;flex-wrap:wrap}
.change.pending{border-color:var(--draft)}

/* preview */
.frame{border:1px solid var(--rule);border-radius:14px;background:var(--paper);padding:18px;display:flex;justify-content:center}
.device{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;width:100%;max-width:760px;overflow:hidden}
.device.phone{max-width:360px;border-radius:28px;border-width:6px;border-color:var(--ink)}
.app-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rule)}
.claim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:default;position:relative}
.comment-mode .claim{cursor:crosshair}
.comment-mode .claim:hover{background:var(--draft-soft)}
.pin{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--draft);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.pv-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}

/* test */
.readiness{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-0.02em}
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--pass);transition:width .5s}
.trace{background:var(--paper);border-radius:8px;padding:10px 12px;margin:0 2px 12px;border:1px solid var(--rule)}
.trace .l{display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:2px 0}
.trace .l.bad{color:var(--fail)}
.test-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.toggle{position:relative;width:38px;height:22px;border-radius:11px;background:var(--rule);border:none;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sheet);transition:left .2s}
.toggle.on{background:var(--pass)}.toggle.on::after{left:19px}

/* gate */
.gate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gate .g{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.log{background:var(--ink);color:var(--on-ink);border-radius:10px;padding:14px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-height:120px}
.log div{padding:1px 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.map .m{padding:14px}
.codebox{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.codebox .btn{position:absolute;top:8px;right:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.feed div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.person{display:flex;align-items:center;gap:10px}
.pav{width:30px;height:30px;border-radius:50%;background:var(--grid);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  .bp-wrap.with-insp,.pv-grid,.test-grid,.home-grid{grid-template-columns:minmax(0,1fr)}
  .insp{position:static}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .menu-btn{display:inline-flex}
  .top{padding:10px 14px;top:env(safe-area-inset-top,0px);flex-wrap:nowrap}
  .page{padding:18px 14px 32px}
  .roles,.gate,.map,.readiness,.two,.doors{grid-template-columns:minmax(0,1fr)}
  .role{min-height:0}
  h1{font-size:25px}
  .hide-sm{display:none}.show-sm{display:inline}
}
@media (max-width:1400px){.bp-wrap.with-insp{grid-template-columns:minmax(0,1fr)}.bp-wrap .insp{position:static}}
@media (max-width:900px){.lanes{grid-template-columns:minmax(0,1fr);grid-template-areas:"sc" "ag" "da" "co";row-gap:14px}.lane-data,.lane-conn{grid-row:auto}.wires{display:none}}
@media (max-width:600px){.lane-screens .items,.lane-agents .items{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
