<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#334155; stroke-width:1.6; rx:10; }
      .title { font-size:16px; font-weight:700; fill:#0f172a; }
      .sub   { font-size:12.5px; fill:#475569; }
      .mono  { font-size:12px; fill:#1d4ed8; font-family:Consolas, Menlo, monospace; }
      .lbl   { font-size:11.5px; fill:#334155; }
      .prod  { fill:#fffbeb; stroke:#b45309; stroke-width:1.4; stroke-dasharray:6 4; rx:10; }
      .ptitle{ font-size:13.5px; font-weight:700; fill:#92400e; }
      .psub  { font-size:11.5px; fill:#92400e; }
      .flow  { stroke:#334155; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .flowD { stroke:#b45309; stroke-width:1.4; fill:none; stroke-dasharray:6 4; marker-end:url(#arrowDashed); }
      .band  { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; rx:12; }
      .bandT { font-size:13px; font-weight:700; fill:#64748b; letter-spacing:1px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#ffffff"/>
  <text x="40" y="42" class="title" font-size="22">Architect 2.0 — System Architecture</text>
  <text x="40" y="64" class="sub">Solid = what runs today (prototype). Dashed amber = production design. API keys never reach the browser; model output is written to files, never executed.</text>

  <!-- ============ TODAY (solid) ============ -->

  <!-- Browser -->
  <rect x="40" y="100" width="250" height="150" class="box"/>
  <text x="60" y="128" class="title">Browser</text>
  <text x="60" y="150" class="sub">index.html + app.js — no build step</text>
  <text x="60" y="170" class="sub">UI: blueprint, preview, chat,</text>
  <text x="60" y="186" class="sub">test, approve, deploy</text>
  <text x="60" y="210" class="mono">Supabase JS client</text>
  <text x="60" y="228" class="sub">Google sign-in, persistence</text>

  <!-- Node API -->
  <rect x="380" y="90" width="330" height="270" class="box"/>
  <text x="400" y="118" class="title">Node API</text>
  <text x="400" y="138" class="sub">dev-server.js — stateless, zero deps</text>
  <text x="400" y="164" class="mono">/api/draft · /api/test · /api/fix</text>
  <text x="400" y="182" class="mono">/api/scenarios · /api/chat · /api/import</text>
  <text x="400" y="200" class="mono">/api/publish · /api/mcp</text>
  <text x="400" y="226" class="sub">Per request: authenticate (Supabase JWT)</text>
  <text x="400" y="242" class="sub">→ credit cap → build prompt → model call</text>
  <text x="400" y="268" class="sub">JSON-only model output, length-capped,</text>
  <text x="400" y="284" class="sub">never eval'd server-side</text>
  <text x="400" y="310" class="sub">Writes generated app to</text>
  <text x="400" y="328" class="mono">apps/&lt;slug&gt;-&lt;env&gt;/index.html</text>
  <text x="400" y="346" class="sub">Serves it as a static page</text>

  <!-- Anthropic -->
  <rect x="800" y="100" width="240" height="90" class="box"/>
  <text x="820" y="128" class="title">Anthropic API</text>
  <text x="820" y="150" class="sub">Claude, JSON mode</text>
  <text x="820" y="168" class="sub">Key lives only on the server</text>

  <!-- Supabase -->
  <rect x="800" y="230" width="240" height="120" class="box"/>
  <text x="820" y="258" class="title">Supabase</text>
  <text x="820" y="280" class="sub">Google Auth (JWT)</text>
  <text x="820" y="298" class="sub">Postgres + row-level security</text>
  <text x="820" y="316" class="mono">projects · test_runs</text>
  <text x="820" y="332" class="mono">deployments · connection_events</text>

  <!-- apps disk -->
  <ellipse cx="920" cy="452" rx="110" ry="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
  <path d="M 810 452 L 810 560 A 110 16 0 0 0 1030 560 L 1030 452" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
  <ellipse cx="920" cy="452" rx="110" ry="16" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="920" y="458" class="title" text-anchor="middle" font-size="14">apps/ on disk</text>
  <text x="920" y="500" class="mono" text-anchor="middle">/app/&lt;slug&gt;-staging/</text>
  <text x="920" y="518" class="mono" text-anchor="middle">/app/&lt;slug&gt;-production/</text>

  <!-- flows: browser <-> node -->
  <path class="flow" d="M 290 165 L 372 165"/>
  <text x="300" y="155" class="lbl">POST /api/* (JSON)</text>
  <path class="flow" d="M 372 205 L 290 205"/>
  <text x="298" y="196" class="lbl">JSON response</text>

  <!-- browser <-> supabase -->
  <path class="flow" d="M 290 240 C 400 350 640 372 790 330"/>
  <text x="480" y="380" class="lbl">auth + data when signed in</text>

  <!-- node -> anthropic -->
  <path class="flow" d="M 710 140 L 792 140"/>
  <text x="718" y="130" class="lbl">prompts</text>

  <!-- node -> disk -->
  <path class="flow" d="M 710 330 C 780 380 800 410 830 435"/>
  <text x="730" y="400" class="lbl">write generated app</text>

  <!-- disk -> browser -->
  <path class="flow" d="M 830 470 C 600 520 300 330 165 252"/>
  <text x="420" y="432" class="lbl">GET /app/&lt;slug&gt;/ — live preview + review links</text>

  <!-- platform deploy -->
  <rect x="40" y="280" width="250" height="70" class="box"/>
  <text x="60" y="306" class="title">Platform deploys on Render</text>
  <text x="60" y="326" class="sub">stateless web service, env vars,</text>
  <text x="60" y="340" class="sub">auto-deploy from GitHub</text>

  <!-- ============ PRODUCTION (dashed) ============ -->

  <rect x="40" y="520" width="1160" height="300" class="band"/>
  <text x="64" y="552" class="bandT">PRODUCTION DESIGN</text>

  <!-- Model router -->
  <rect x="80" y="580" width="250" height="100" class="prod"/>
  <text x="100" y="608" class="ptitle">Model router</text>
  <text x="100" y="628" class="psub">One interface behind</text>
  <text x="100" y="644" class="psub">Anthropic / OpenAI / Gemini / OSS (vLLM)</text>
  <text x="100" y="664" class="psub">per-stage model, fallback chain, eval-gated</text>

  <!-- Agent harness -->
  <rect x="370" y="580" width="270" height="100" class="prod"/>
  <text x="390" y="608" class="ptitle">Agent harness</text>
  <text x="390" y="628" class="psub">plan → write → run → observe → recover</text>
  <text x="390" y="646" class="psub">tool use, journaled checkpoints, retries</text>
  <text x="390" y="664" class="psub">queue-based, rate-limited model calls</text>

  <!-- Sandbox fleet -->
  <rect x="680" y="580" width="250" height="100" class="prod"/>
  <text x="700" y="608" class="ptitle">Sandbox fleet</text>
  <text x="700" y="628" class="psub">E2B / Firecracker microVMs per build</text>
  <text x="700" y="646" class="psub">user code runs only here, isolated,</text>
  <text x="700" y="664" class="psub">ephemeral, network-egress-controlled</text>

  <!-- GitHub App -->
  <rect x="990" y="580" width="190" height="100" class="prod"/>
  <text x="1010" y="608" class="ptitle">GitHub App</text>
  <text x="1010" y="628" class="psub">OAuth, per-project repo,</text>
  <text x="1010" y="646" class="psub">architect/change-N</text>
  <text x="1010" y="664" class="psub">branches + PRs on deploy</text>

  <!-- Deploy path -->
  <rect x="370" y="708" width="560" height="86" class="prod"/>
  <text x="390" y="736" class="ptitle">Build queue → object storage + CDN</text>
  <text x="390" y="756" class="psub">Generated apps are static artifacts: upload once, serve at the edge.</text>
  <text x="390" y="774" class="psub">API tier scales horizontally (stateless); Supabase holds all state; same-origin</text>
  <text x="390" y="790" class="psub">serving replaced by isolated origins per app.</text>

  <!-- dashed connectors -->
  <path class="flowD" d="M 450 580 L 450 368"/>
  <text x="462" y="480" class="psub">model calls via router</text>
  <path class="flowD" d="M 930 628 C 955 624 966 614 986 606"/>
  <text x="845" y="702" class="psub">repo scan / PRs</text>
  <path class="flowD" d="M 710 340 C 760 460 700 540 640 576"/>
</svg>
